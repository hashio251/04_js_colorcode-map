<!DOCTYPE html>
<html lang="ja">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker | カラーピッカー</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>


<body>
  <header>

  </header>


  <main>
    <div class="main-container">
      <div class="serch-box">
        <div class="first-color color-box">
          <div class="color-picker-box">
            <p class="color-text">カラーコードを検索</p>
            <input class="color-picker" type="color">
          </div>

          <div class="circle"></div>
        </div>

        <p class="plus">+</p>

        <div class="second-color color-box">
          <div class="color-picker-box">
            <p class="color-text">カラーコードを検索</p>
            <input class="color-picker" type="color">
          </div>

          <div class="circle"></div>
        </div>
      </div>

      <div class="mix-btn">
        <p id="mixColorBg" class="btn-txt">→ 色を混ぜてみる</p>
        <button id="copyButton" class="copy-btn">カラーコードをコピーする</button>
      </div>
      <div class="back-btn">
        <a href="../index.html">
          <p class="btn-txt">→ 戻る</p>
        </a>
      </div>
    </div>
  </main>


  <footer>

  </footer>

  <script src="../assets/js/mix.js" defer></script>
</body>


</html>
